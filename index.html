
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irregular Verbs Practice</title>
<style>
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --text: #242735;
  --muted: #85899a;
  --border: #e7e9f0;
  --accent: #6558d3;
  --green: #dff5e6;
  --green-text: #18763b;
  --red: #fde5e5;
  --red-text: #bd3434;
}

.answer {
  display: none;
  color: #18763b;
  font-size: 12px;
  margin-top: 5px;
  font-weight: 600;
}
body.show-answers .answer {
  display: block;
}
  
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 30px 20px 60px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.container { max-width: 1250px; margin: auto; }
header { margin-bottom: 25px; }
h1 { font-size: 27px; margin: 0 0 8px; }
.subtitle { color: var(--muted); font-size: 14px; }
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.stat {
  background: var(--surface);
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
}
.stat-label { color: var(--muted); font-size: 12px; }
.stat-value { font-size: 23px; font-weight: 700; margin-top: 5px; }
.progress {
  height: 7px;
  background: #e5e5ef;
  border-radius: 20px;
  overflow: hidden;
  margin: 15px 0 22px;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width .2s;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}
button {
  border: 0;
  border-radius: 9px;
  padding: 12px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
button:active { transform: scale(.98); }
.primary { background: var(--accent); color: white; }
.secondary { background: white; color: var(--text); border: 1px solid var(--border); }
.table-wrap {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
th {
  background: #f8f8fb;
  color: #74788a;
  text-align: left;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
  padding: 14px 12px;
  position: sticky;
  top: 0;
  z-index: 1;
}
td {
  border-top: 1px solid var(--border);
  padding: 8px 10px;
  font-size: 14px;
}
td:first-child { font-weight: 650; }
td.translation { color: #65697a; }
input {
  width: 100%;
  min-width: 90px;
  padding: 10px 9px;
  border: 1px solid #e1e3eb;
  border-radius: 7px;
  outline: none;
  font-size: 14px;
  color: var(--text);
  background: white;
}
input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px #6558d322;
}
tr.correct { background: var(--green); }
tr.wrong { background: var(--red); }
tr.correct td { border-color: #c4e9d0; }
tr.wrong td { border-color: #f5cccc; }
input.field-correct {
  border-color: #39a761;
  background: #f5fff7;
}
input.field-wrong {
  border-color: #d94c4c;
  background: #fff7f7;
}
.message {
  margin-top: 14px;
  font-size: 13px;
  color: var(--muted);
  min-height: 20px;
}
@media(max-width: 700px) {
  body { padding: 20px 10px 40px; }
  h1 { font-size: 22px; }
  .stats { gap: 7px; }
  .stat { padding: 11px 8px; }
  .stat-value { font-size: 19px; }
  .table-wrap { overflow-x: auto; }
  table { min-width: 760px; }
  th, td { padding: 9px 8px; }
  input { min-width: 110px; }
  button { padding: 11px 13px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Irregular Verbs</h1>
    <div class="subtitle">Тренажёр неправильных глаголов</div>
  </header>

  <section class="stats">
    <div class="stat">
      <div class="stat-label">Всего глаголов</div>
      <div class="stat-value" id="total">116</div>
    </div>
    <div class="stat">
      <div class="stat-label">Правильно</div>
      <div class="stat-value" id="correctCount">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Ошибки</div>
      <div class="stat-value" id="wrongCount">0</div>
    </div>
  </section>

  <div class="progress">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="controls">
    <button class="primary" onclick="checkAnswers()">Проверить</button>
    <button class="secondary" onclick="shuffleWords()">⇄ Перемешать</button>
    <button class="secondary" onclick="resetAnswers()">Сбросить ответы</button>
    <button class="secondary" onclick="toggleAnswers()">?</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Infinitive</th>
          <th>Past Simple</th>
          <th>Past Participle</th>
          <th>Перевод</th>
        </tr>
      </thead>
      <tbody id="verbTable"></tbody>
    </table>
  </div>

  <div class="message" id="message">
    Заполни все поля и нажми «Проверить».
  </div>
</div>

<script>

["sweep","swept","swept","Подметать",["подметать","мести"]],
["swim","swam","swum","Плыть",["плыть","плавать"]],
["swing","swung","swung","Качаться",["качаться","раскачивать"]],
["take","took","taken","Брать",["брать","взять"]],
["teach","taught","taught","Учить",["учить","преподавать","обучать"]],

["tell","told","told","Рассказывать",["рассказывать","сообщать","говорить"]],
["think","thought","thought","Думать",["думать","считать"]],

["wake","woke|waked","woken|waked","Просыпаться",["просыпаться","будить"]],
["wear","wore","worn","Носить",["носить","быть одетым"]],
["weep","wept","wept","Плакать",["плакать","рыдать"]],
["win","won","won","Выигрывать",["выигрывать","побеждать"]],
["write","wrote","written","Писать",["писать","записывать"]]
];

let currentVerbs = [...verbs];

function renderTable() {
  const tbody = document.getElementById("verbTable");
  tbody.innerHTML = "";

  currentVerbs.forEach((verb, index) => {
    const row = document.createElement("tr");
    row.dataset.index = index;

 row.innerHTML = `
  <td>
    ${verb[0]}
    <div class="answer">${verb[0]}</div>
  </td>
  <td>
    <input type="text" autocomplete="off" data-field="1">
    <div class="answer">${verb[1].replace(/\|/g, " / ")}</div>
  </td>
  <td>
    <input type="text" autocomplete="off" data-field="2">
    <div class="answer">${verb[2].replace(/\|/g, " / ")}</div>
  </td>
  <td class="translation">
    <input type="text" autocomplete="off" data-field="3">
    <div class="answer">${verb[3]}</div>
  </td>
    `;

    tbody.appendChild(row);
  });

  updateStats();
}

function normalize(value) {
  return value.toLowerCase()
    .trim()
    .replace(/ё/g, "е")
    .replace(/\s+/g, " ")
    .replace(/\s*\/\s*/g, "/")
    .replace(/[.,!?;:]+$/g, "");
}

function checkOne(input, accepted) {
  const answer = normalize(input);
  if (!answer) return false;

  return accepted.split("|").some(option => {
    return answer === normalize(option);
  });
}

function checkTranslation(input, accepted) {
  const answer = normalize(input);
  if (!answer) return false;

  return accepted.some(option => normalize(option) === answer);
}

function checkAnswers() {
  let correct = 0;
  let wrong = 0;

  document.querySelectorAll("#verbTable tr").forEach(row => {
    const index = Number(row.dataset.index);
    const verb = currentVerbs[index];
    const inputs = row.querySelectorAll("input");

    let rowCorrect = true;

    inputs.forEach(input => {
      const field = Number(input.dataset.field);
      const valid = field === 3
        ? checkTranslation(input.value, verb[4])
        : checkOne(input.value, verb[field]);

      input.classList.remove("field-correct", "field-wrong");
      input.classList.add(valid ? "field-correct" : "field-wrong");

      if (!valid) rowCorrect = false;
    });

    row.classList.remove("correct", "wrong");
    row.classList.add(rowCorrect ? "correct" : "wrong");

    if (rowCorrect) correct++;
    else wrong++;
  });

  document.getElementById("correctCount").textContent = correct;
  document.getElementById("wrongCount").textContent = wrong;
  document.getElementById("progressFill").style.width =
    (correct / currentVerbs.length * 100) + "%";

  document.getElementById("message").textContent =
    correct === currentVerbs.length
      ? "🎉 Отлично! Все ответы правильные!"
      : `Правильных строк: ${correct} из ${currentVerbs.length}. Исправь красные поля и проверь ещё раз.`;
}

function updateStats() {
  document.getElementById("correctCount").textContent = "0";
  document.getElementById("wrongCount").textContent = "0";
  document.getElementById("progressFill").style.width = "0%";
}

function shuffleWords() {
  // Сохраняем введённые ответы вместе с каждым глаголом.
  const answers = new Map();

  document.querySelectorAll("#verbTable tr").forEach(row => {
    const index = Number(row.dataset.index);
    const inputs = [...row.querySelectorAll("input")];
    answers.set(currentVerbs[index][0], inputs.map(input => input.value));
  });

  for (let i = currentVerbs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentVerbs[i], currentVerbs[j]] =
      [currentVerbs[j], currentVerbs[i]];
  }

function toggleAnswers() {
  document.body.classList.toggle("show-answers");
}
  
  renderTable();

  document.querySelectorAll("#verbTable tr").forEach(row => {
    const verb = currentVerbs[Number(row.dataset.index)];
    const saved = answers.get(verb[0]);
    if (!saved) return;

    row.querySelectorAll("input").forEach((input, i) => {
      input.value = saved[i];
    });
  });

}

function resetAnswers() {
  document.querySelectorAll("#verbTable tr").forEach(row => {
    row.classList.remove("correct", "wrong");

    row.querySelectorAll("input").forEach(input => {
      input.value = "";
      input.classList.remove("field-correct", "field-wrong");
    });
  });

  updateStats();
  document.getElementById("message").textContent =
    "Ответы очищены. Начинай заново!";
}

renderTable();
</script>
</body>
</html>
